name: Regenerer les flux

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["feeds.yaml", "generate.py"]

permissions:
  contents: write

concurrency:
  group: flux
  cancel-in-progress: false

jobs:
  flux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install --quiet requests beautifulsoup4 lxml pyyaml

      - name: Generer les flux
        run: |
          DEPOT="${GITHUB_REPOSITORY#*/}"
          python3 generate.py --base-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${DEPOT}/"

      - name: Publier les changements
        run: |
          git config user.name "cloclo-bot"
          git config user.email "cloclo-bot@users.noreply.github.com"
          git add docs state
          if git diff --cached --quiet; then
            echo "Rien de neuf, pas de commit."
          else
            git commit -m "Flux regeneres"
            git push
          fi
