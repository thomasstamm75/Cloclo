[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rssgen"
version = "1.0.0"
description = "Générateur de flux RSS pour les pages web qui n'en proposent pas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "PyYAML>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
rssgen = "rssgen.cli:main"

[tool.setuptools.packages.find]
include = ["rssgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
